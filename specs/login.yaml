# yaml-language-server: $schema=../schema/sdd-flow.schema.json
schemaVersion: 2

scenario:
  id: login
  project: 会員ポータル
  domain: 認証
  title: ログインしてトップ画面を表示する
  heading: 情報が入り、変化し、画面に戻るまで
  status: レビュー中
  defaultStory: US-101
  defaultPath: happy
  defaultLevel: 2
  selectedNode: login-action

lanes:
  - id: browser
    label: ユーザー / ブラウザ
    code: "01"
    subtitle: front stage
  - id: system
    label: 自システム
    code: "02"
    subtitle: application
  - id: external
    label: 外部認証
    code: "03"
    subtitle: integration
  - id: resource
    label: リソース
    code: "04"
    subtitle: state

stories:
  - id: US-101
    title: 会員としてログインし、トップ画面を表示したい
    state: レビュー中
    nodes: [login-screen, login-action, login-command, account-query, account-decision, profile-query, session-created, login-succeeded, top-screen]
  - id: US-102
    title: 認証に失敗した理由を確認して、再入力したい
    state: レビュー中
    nodes: [login-screen, login-action, login-command, account-query, account-decision, login-rejected, auth-error-view]
  - id: US-103
    title: ログイン後に自分のプロフィールを確認したい
    state: 準備完了
    nodes: [session-created, top-screen, profile-command, profile-view]

nodes:
  - id: login-screen
    lane: browser
    column: 1
    type: view
    path: both
    title:
      level1: ログインする
      level2: ログイン画面
      level3: GET /login
    technical: "route: /login"
    detail:
      description: 会員IDとパスワードを入力できる状態を表示します。
      behavior:
        given: 未認証で会員ポータルへアクセスしている
        when: ログイン画面を開く
        then: 認証情報の入力欄とログイン操作を表示する
      assumption: ログイン画面は認証なしで参照できます。
      links: [US-101, US-102, UI-LOGIN-01]

  - id: login-action
    lane: browser
    column: 2
    type: action
    path: both
    expands: credential-entry
    title:
      level1: 認証情報を入力
      level2: ログインする
      level3: submit credentials
    technical: onSubmit(loginForm)
    detail:
      description: 会員がIDとパスワードを入力し、ログインを実行します。
      behavior:
        given: 会員IDとパスワードが入力されている
        when: 「ログインする」を選択する
        then: 入力内容を検証し、ログイン要求を送る
      assumption: パスワードは画面やクライアントログに残しません。
      links: [US-101, US-102, AC-101-01]

  - id: login-command
    lane: system
    column: 3
    type: command
    path: both
    title:
      level1: ログインを確認
      level2: ログインを要求する
      level3: POST /api/session
    technical: AuthenticateMember
    detail:
      description: 受け取った認証情報を使い、会員の認証処理を開始します。
      behavior:
        given: 形式検証を通過した認証情報を受信している
        when: ログイン要求を受け付ける
        then: 外部認証システムへアカウントを照会する
      assumption: 同一アカウントへの過剰な試行はレート制限されます。
      links: [US-101, US-102, CMD-AUTH-01]

  - id: account-query
    lane: external
    column: 4
    type: integration
    path: both
    title:
      level1: アカウント照会
      level2: アカウントを照会する
      level3: POST /oauth/introspect
    technical: Identity API / v2
    detail:
      description: 外部認証システムへ資格情報を渡し、アカウント状態を確認します。
      behavior:
        given: 外部認証システムへの接続情報が有効である
        when: 資格情報を照会する
        then: 有効性と会員識別子を返す
      assumption: 外部認証システムがアカウントの有効性を保証します。
      links: [US-101, US-102, INT-IDP-02, SLA-2000MS]

  - id: account-decision
    lane: system
    column: 5
    type: decision
    path: both
    title:
      level1: 認証結果を判断
      level2: アカウントは有効？
      level3: result.active === true
    technical: AuthPolicy.evaluate()
    detail:
      description: 外部システムの応答をもとに、正常系と異常系へ分岐します。
      behavior:
        given: 外部認証システムから照会結果を受け取っている
        when: アカウントの有効性を評価する
        then: 有効ならプロフィール取得、無効なら認証失敗を確定する
      assumption: 不明な応答は安全側に倒し、認証失敗として扱います。
      links: [US-101, US-102, RULE-AUTH-03]

  - id: profile-query
    lane: external
    column: 6
    type: integration
    path: happy
    title:
      level1: プロフィール取得
      level2: プロフィールを取得する
      level3: GET /members/{id}
    technical: Member Profile API
    detail:
      description: 認証済みの会員識別子を使い、トップ画面に必要な情報を取得します。
      behavior:
        given: 有効な会員識別子を取得している
        when: 会員プロフィールを要求する
        then: 表示名、会員種別、権限を返す
      assumption: 取得結果には表示に必要な最小限の個人情報だけが含まれます。
      links: [US-101, INT-MEMBER-01]

  - id: login-rejected
    lane: system
    column: 6
    type: event
    path: exception
    title:
      level1: ログイン失敗
      level2: 認証が拒否された
      level3: AuthenticationRejected
    technical: "reason: INVALID_CREDENTIALS"
    detail:
      description: 認証できなかった事実を確定し、安全なエラー理由へ変換します。
      behavior:
        given: アカウントが無効、または資格情報が一致しない
        when: 認証ポリシーが拒否を決定する
        then: 再入力可能なエラーをブラウザへ返す
      assumption: アカウントの存在有無はエラーメッセージから推測できません。
      links: [US-102, EVT-AUTH-04]

  - id: auth-error-view
    lane: browser
    column: 7
    type: view
    path: exception
    title:
      level1: 認証情報を再入力
      level2: 認証エラーを表示する
      level3: render AuthError
    technical: "error: INVALID_CREDENTIALS"
    detail:
      description: アカウントの存在有無を明かさず、再入力できるエラーを表示します。
      behavior:
        given: 認証が拒否された応答を受け取っている
        when: ログイン画面へエラー状態を返す
        then: 入力欄を再表示し、認証情報の確認を促す
      assumption: 会員IDの入力値は維持し、パスワードは空に戻します。
      links: [US-102, UI-LOGIN-02, AC-102-01]

  - id: session-created
    lane: resource
    column: 7
    type: state
    path: happy
    title:
      level1: ログイン状態を保存
      level2: セッションを作成する
      level3: session_store.insert
    technical: "TTL: 30 min / Redis"
    detail:
      description: プロフィールと権限をセッションとして保存します。
      behavior:
        given: 有効な会員プロフィールを取得している
        when: 認証済みセッションを作成する
        then: 推測困難なセッションIDと有効期限を保存する
      assumption: セッションIDはSecure・HttpOnly Cookieでのみ返します。
      links: [US-101, US-103, DATA-SESSION-01]

  - id: login-succeeded
    lane: system
    column: 8
    type: event
    path: happy
    title:
      level1: ログイン完了
      level2: ログインが成立した
      level3: MemberAuthenticated
    technical: "event: auth.succeeded.v1"
    detail:
      description: セッション作成後、ログインが成立した事実を確定します。
      behavior:
        given: セッションの保存が完了している
        when: ログイン処理を完了する
        then: トップ画面への遷移情報を返す
      assumption: 監査ログには会員識別子と結果を記録し、資格情報は記録しません。
      links: [US-101, EVT-AUTH-01, AUDIT-01]

  - id: top-screen
    lane: browser
    column: 9
    type: view
    path: happy
    title:
      level1: トップ画面へ移動
      level2: トップ画面に遷移する
      level3: HTTP 303 → /home
    technical: router.replace('/home')
    detail:
      description: ログイン画面を履歴に残さず、会員トップへ遷移します。
      behavior:
        given: ログイン成立の応答を受け取っている
        when: 遷移先としてトップ画面が指定される
        then: トップ画面を表示し、プロフィール表示を開始する
      assumption: ブラウザの戻る操作で認証情報の入力内容を再表示しません。
      links: [US-101, US-103, UI-HOME-01]

  - id: profile-command
    lane: system
    column: 10
    type: command
    path: happy
    title:
      level1: 会員情報を表示
      level2: プロフィールを要求する
      level3: GET /api/me
    technical: GetCurrentMemberView
    detail:
      description: セッションを使い、トップ画面用のプロフィールを要求します。
      behavior:
        given: 認証済みセッションが存在する
        when: トップ画面がプロフィールを要求する
        then: セッションから表示用プロフィールを読み取る
      assumption: この要求では外部プロフィールAPIを再度呼び出しません。
      links: [US-103, QRY-MEMBER-01]

  - id: profile-view
    lane: browser
    column: 11
    type: view
    path: happy
    title:
      level1: プロフィールを確認
      level2: プロフィールを表示する
      level3: render ProfileSummary
    technical: "view-model: CurrentMember"
    detail:
      description: 表示名と会員種別をトップ画面に表示します。
      behavior:
        given: 表示用プロフィールを受け取っている
        when: トップ画面を描画する
        then: 会員が自分のログイン状態とプロフィールを確認できる
      assumption: 権限のないプロフィール項目はレスポンスに含めません。
      links: [US-103, UI-HOME-02, AC-103-01]

edges:
  - from: login-screen
    to: login-action
    type: sequence
    path: both
  - from: login-action
    to: login-command
    type: triggers
    path: both
  - from: login-command
    to: account-query
    type: requests
    path: both
  - from: account-query
    to: account-decision
    type: responds
    path: both
  - from: account-decision
    to: profile-query
    type: requests
    path: happy
    label: YES
  - from: account-decision
    to: login-rejected
    type: produces
    path: exception
    label: NO
  - from: profile-query
    to: session-created
    type: writes
    path: happy
  - from: session-created
    to: login-succeeded
    type: produces
    path: happy
  - from: login-succeeded
    to: top-screen
    type: transitions
    path: happy
  - from: top-screen
    to: profile-command
    type: triggers
    path: happy
  - from: profile-command
    to: profile-view
    type: responds
    path: happy
  - from: login-rejected
    to: auth-error-view
    type: responds
    path: exception
  - from: auth-error-view
    to: login-screen
    type: returns
    path: exception
    label: RETRY
    loop: true

subflows:
  credential-entry:
    title: 認証情報を入力して送信する
    summary: 入力、形式検証、ボタン活性化、送信までを親ノード「ログインする」の内側に定義します。
    span: 6
    tracks:
      - id: input
        label: ユーザー入力
        code: IN
      - id: rule
        label: クライアント検証
        code: RULE
      - id: ui
        label: 画面状態
        code: UI
    nodes:
      - id: member-id-input
        track: input
        column: 1
        type: action
        path: both
        title:
          level1: IDを入力
          level2: 会員IDを入力する
          level3: input[name=memberId]
        technical: onInput(memberId)
        detail:
          description: 会員がログインに使用するIDを入力します。
          behavior:
            given: ログイン画面が表示されている
            when: 会員ID欄へ文字を入力する
            then: 入力値を保持し、IDの形式検証を開始する
          assumption: 前後の空白は検証前に取り除きます。
          links: [US-101, US-102, UI-LOGIN-ID]

      - id: member-id-format
        track: rule
        column: 2
        type: decision
        path: both
        title:
          level1: ID形式を確認
          level2: 会員IDの形式は正しい？
          level3: memberIdSchema.safeParse
        technical: "rule: 8-32 chars / ASCII"
        detail:
          description: 会員IDの長さと利用可能な文字をクライアント側で検証します。
          behavior:
            given: 会員IDが入力されている
            when: 入力値が変化する
            then: 形式が正しい場合だけ次の入力へ進める
          assumption: この検証は利便性のためで、サーバー側でも同じ制約を検証します。
          links: [US-101, RULE-LOGIN-ID]

      - id: password-input
        track: input
        column: 3
        type: action
        path: both
        title:
          level1: PWを入力
          level2: パスワードを入力する
          level3: input[type=password]
        technical: onInput(password)
        detail:
          description: 会員がパスワードをマスクされた入力欄へ入力します。
          behavior:
            given: 会員IDの形式が正しい
            when: パスワード欄へ文字を入力する
            then: 入力値を画面表示せず、パスワードの形式検証を開始する
          assumption: パスワードはブラウザのログや分析イベントへ送信しません。
          links: [US-101, US-102, UI-LOGIN-PW]

      - id: password-format
        track: rule
        column: 4
        type: decision
        path: both
        title:
          level1: PW形式を確認
          level2: パスワードの形式は正しい？
          level3: passwordSchema.safeParse
        technical: "rule: 12-128 chars"
        detail:
          description: 必須、長さ、制御文字の有無をクライアント側で検証します。
          behavior:
            given: パスワードが入力されている
            when: 入力値が変化する
            then: 形式が正しい場合だけログイン操作を有効にする
          assumption: 複雑性の判定は認証時ではなくパスワード登録時に行います。
          links: [US-101, RULE-LOGIN-PW]

      - id: login-form-ready
        track: ui
        column: 5
        type: state
        path: happy
        title:
          level1: ボタンを有効化
          level2: ログインボタンが活性化した
          level3: formState.isValid = true
        technical: derived form state
        detail:
          description: IDとパスワードがともに形式検証を通過した画面状態です。
          behavior:
            given: 2つの入力項目がどちらも有効である
            when: フォーム全体の状態を再計算する
            then: ログインボタンを押せる状態にする
          assumption: 送信中は二重送信防止のため再び無効化します。
          links: [US-101, UI-LOGIN-STATE]

      - id: login-button-click
        track: input
        column: 6
        type: action
        path: happy
        title:
          level1: ログインを実行
          level2: ログインボタンをクリックする
          level3: form.requestSubmit()
        technical: onSubmit(loginForm)
        detail:
          description: 検証済みの入力内容でログイン要求を開始します。
          behavior:
            given: ログインボタンが活性化している
            when: 会員がログインボタンを選択する
            then: 送信中状態へ変更し、親フローのログイン要求へ接続する
          assumption: Enterキーによる送信も同じ処理へ合流します。
          links: [US-101, AC-101-01]

      - id: member-id-error
        track: ui
        column: 3
        type: view
        path: exception
        title:
          level1: IDを修正
          level2: 会員IDの形式エラーを表示する
          level3: render memberIdError
        technical: aria-describedby=id-error
        detail:
          description: 認証処理を始める前に修正できる形式エラーを表示します。
          behavior:
            given: 会員IDの形式が不正である
            when: ID欄からフォーカスが外れる
            then: 問題のある条件を示してID欄へ関連付ける
          assumption: アカウントの存在有無には言及しません。
          links: [US-102, UI-LOGIN-ID-ERROR]

      - id: password-error
        track: ui
        column: 5
        type: view
        path: exception
        title:
          level1: PWを修正
          level2: パスワードの形式エラーを表示する
          level3: render passwordError
        technical: aria-describedby=password-error
        detail:
          description: 送信前に修正できるパスワードの形式エラーを表示します。
          behavior:
            given: パスワードの形式が不正である
            when: パスワード欄からフォーカスが外れる
            then: 入力値を表示せず、満たしていない条件を示す
          assumption: エラー表示から入力済み文字数を推測できないようにします。
          links: [US-102, UI-LOGIN-PW-ERROR]
    edges:
      - from: member-id-input
        to: member-id-format
        type: triggers
        path: both
      - from: member-id-format
        to: password-input
        type: enables
        path: happy
        label: OK
      - from: member-id-format
        to: member-id-error
        type: produces
        path: exception
        label: INVALID
      - from: member-id-error
        to: member-id-input
        type: returns
        path: exception
        loop: true
      - from: password-input
        to: password-format
        type: triggers
        path: both
      - from: password-format
        to: login-form-ready
        type: enables
        path: happy
        label: OK
      - from: password-format
        to: password-error
        type: produces
        path: exception
        label: INVALID
      - from: password-error
        to: password-input
        type: returns
        path: exception
        loop: true
      - from: login-form-ready
        to: login-button-click
        type: enables
        path: happy
