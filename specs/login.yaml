# yaml-language-server: $schema=../schema/sdd-flow.schema.json
schemaVersion: 3

scenario:
  id: login
  project: 会員ポータル
  domain: 認証
  title: ログインしてトップ画面を表示する
  heading: ユーザーの操作から価値が届くまで
  status: レビュー中
  defaultStory: US-101
  defaultPath: happy
  selectedNode: credential-input

stories:
  - id: US-101
    title: 会員としてログインし、トップ画面を表示したい
    state: レビュー中
    nodes: [login-screen, credential-input, login-attempt, top-screen]
  - id: US-102
    title: 認証に失敗した理由を確認して、再入力したい
    state: レビュー中
    nodes: [login-screen, credential-input, login-attempt, auth-error-view]
  - id: US-103
    title: ログイン後に自分のプロフィールを確認したい
    state: 準備完了
    nodes: [top-screen, profile-view]

experience:
  nodes:
    - id: login-screen
      type: view
      path: both
      title: ログイン画面を見る
      technical: "route: /login"
      detail:
        description: 会員IDとパスワードを入力できる画面を表示します。
        behavior:
          given: 未認証で会員ポータルへアクセスしている
          when: ログイン画面を開く
          then: 認証情報の入力欄とログイン操作を確認できる
        assumption: ログイン画面は認証なしで参照できます。
        links: [US-101, US-102, UI-LOGIN-01]

    - id: credential-input
      type: action
      path: both
      expands: credential-entry
      title: 認証情報を入力する
      technical: Login form interaction
      detail:
        description: 会員IDとパスワードを順不同で入力し、送信できる状態にします。
        behavior:
          given: ログイン画面が表示されている
          when: 会員IDとパスワードを入力する
          then: 両方の形式が正しければログイン操作が有効になる
        assumption: 入力順序は固定しません。
        links: [US-101, US-102, AC-101-INPUT]

    - id: login-attempt
      type: action
      path: both
      expands: authentication
      title: ログインを試行する
      technical: Submit credentials
      detail:
        description: 入力済みの認証情報を送信し、認証結果を待ちます。
        behavior:
          given: ログイン操作が有効である
          when: ログインを実行する
          then: 成功時はトップ画面、失敗時はエラー表示へ進む
        assumption: 送信中は二重送信を防止します。
        links: [US-101, US-102, AC-101-SUBMIT]

    - id: top-screen
      type: view
      path: happy
      expands: home-loading
      title: トップ画面へ移動する
      technical: "HTTP 303 -> /home"
      detail:
        description: ログイン画面を履歴に残さず、会員トップへ遷移します。
        behavior:
          given: ログインに成功している
          when: トップ画面への遷移を受け取る
          then: トップ画面を表示して会員情報の取得を始める
        assumption: 戻る操作で認証情報を再表示しません。
        links: [US-101, US-103, UI-HOME-01]

    - id: auth-error-view
      type: view
      path: exception
      title: 認証エラーを確認する
      technical: render AuthError
      detail:
        description: アカウントの存在有無を明かさず、再入力できるエラーを表示します。
        behavior:
          given: ログインが拒否されている
          when: エラー応答を受け取る
          then: 入力内容を見直して再試行できる
        assumption: 会員IDは維持し、パスワードは空に戻します。
        links: [US-102, UI-LOGIN-02]

    - id: profile-view
      type: view
      path: happy
      title: 自分のプロフィールを確認する
      technical: render ProfileSummary
      detail:
        description: 表示名と会員種別をトップ画面で確認できます。
        behavior:
          given: トップ画面用プロフィールを受け取っている
          when: プロフィール領域を描画する
          then: 自分のログイン状態とプロフィールを確認できる
        assumption: 権限のない項目はレスポンスに含めません。
        links: [US-103, UI-HOME-02]

  edges:
    - { from: login-screen, to: credential-input, type: sequence, path: both }
    - { from: credential-input, to: login-attempt, type: enables, path: both }
    - { from: login-attempt, to: top-screen, type: transitions, path: happy, label: SUCCESS }
    - { from: login-attempt, to: auth-error-view, type: responds, path: exception, label: REJECTED }
    - { from: auth-error-view, to: credential-input, type: returns, path: exception, label: RETRY, loop: true }
    - { from: top-screen, to: profile-view, type: sequence, path: happy }

subflows:
  credential-entry:
    kind: interaction
    title: 認証情報を入力できる状態にする
    summary: 会員IDとパスワードを順不同で入力し、両方の検証完了後に送信操作を有効にします。
    entry: [member-id-input, password-input]
    exits:
      happy: [login-form-ready]
      exception: []
    tracks:
      - { id: member-id, label: 会員ID, code: ID }
      - { id: password, label: パスワード, code: PW }
      - { id: form-state, label: フォーム状態, code: UI }
    groups:
      credential-fields:
        label: IDとパスワードはどちらからでも入力できる
        mode: unordered
        members: [member-id-input, password-input]
    nodes:
      - id: member-id-input
        track: member-id
        type: action
        path: both
        title: 会員IDを入力する
        technical: onInput(memberId)
        detail:
          description: ログインに使用する会員IDを入力します。
          behavior: { given: ログイン画面が表示されている, when: 会員IDを入力する, then: IDの形式検証を開始する }
          assumption: 前後の空白は検証前に取り除きます。
          links: [US-101, UI-LOGIN-ID]

      - id: password-input
        track: password
        type: action
        path: both
        title: パスワードを入力する
        technical: onInput(password)
        detail:
          description: パスワードをマスクされた入力欄へ入力します。
          behavior: { given: ログイン画面が表示されている, when: パスワードを入力する, then: パスワードの形式検証を開始する }
          assumption: 入力値はログや分析イベントへ送信しません。
          links: [US-101, UI-LOGIN-PW]

      - id: member-id-format
        track: member-id
        type: decision
        path: both
        title: 会員IDの形式を検証する
        technical: memberIdSchema.safeParse
        detail:
          description: 会員IDの長さと利用可能な文字を検証します。
          behavior: { given: 会員IDが入力されている, when: 入力値が変化する, then: 有効性をフォーム状態へ反映する }
          assumption: サーバー側でも同じ制約を検証します。
          links: [RULE-LOGIN-ID]

      - id: password-format
        track: password
        type: decision
        path: both
        title: パスワードの形式を検証する
        technical: passwordSchema.safeParse
        detail:
          description: 必須、長さ、制御文字の有無を検証します。
          behavior: { given: パスワードが入力されている, when: 入力値が変化する, then: 有効性をフォーム状態へ反映する }
          assumption: 複雑性はパスワード登録時に判定します。
          links: [RULE-LOGIN-PW]

      - id: member-id-error
        track: member-id
        type: view
        path: exception
        title: 会員IDの形式エラーを表示する
        technical: aria-describedby=id-error
        detail:
          description: 修正すべきIDの形式条件を表示します。
          behavior: { given: 会員IDの形式が不正である, when: 検証が完了する, then: ID欄に関連付けてエラーを表示する }
          assumption: アカウントの存在有無には言及しません。
          links: [US-102, UI-LOGIN-ID-ERROR]

      - id: password-error
        track: password
        type: view
        path: exception
        title: パスワードの形式エラーを表示する
        technical: aria-describedby=password-error
        detail:
          description: 修正すべきパスワードの形式条件を表示します。
          behavior: { given: パスワードの形式が不正である, when: 検証が完了する, then: 入力値を見せずにエラーを表示する }
          assumption: エラー表示から入力済み文字数を推測できないようにします。
          links: [US-102, UI-LOGIN-PW-ERROR]

      - id: login-form-ready
        track: form-state
        join: all
        type: state
        path: happy
        title: ログイン操作を有効にする
        technical: formState.isValid
        detail:
          description: 2つの入力項目がどちらも有効な画面状態です。
          behavior: { given: IDとパスワードがともに有効である, when: フォーム状態を再計算する, then: ログイン操作を有効にする }
          assumption: 送信中は再び無効化します。
          links: [US-101, UI-LOGIN-STATE]

    edges:
      - { from: member-id-input, to: member-id-format, type: triggers, path: both }
      - { from: password-input, to: password-format, type: triggers, path: both }
      - { from: member-id-format, to: login-form-ready, type: enables, path: happy }
      - { from: password-format, to: login-form-ready, type: enables, path: happy }
      - { from: member-id-format, to: member-id-error, type: produces, path: exception }
      - { from: password-format, to: password-error, type: produces, path: exception }
      - { from: member-id-error, to: member-id-input, type: returns, path: exception, loop: true }
      - { from: password-error, to: password-input, type: returns, path: exception, loop: true }

  authentication:
    kind: orchestration
    title: 認証結果を確定する
    summary: ブラウザからの要求を外部認証へ照会し、監査記録とセッション作成を経て結果を返します。
    entry: [login-button-click]
    exits:
      happy: [login-succeeded]
      exception: [auth-error-response]
    tracks:
      - { id: browser, label: ブラウザ, code: WEB }
      - { id: system, label: 自システム, code: APP }
      - { id: external, label: 外部認証, code: IDP }
      - { id: resource, label: リソース, code: DATA }
    groups:
      post-auth-work:
        label: 認証成功後に並列で開始する処理
        mode: parallel
        members: [profile-query, audit-login]
    nodes:
      - id: login-button-click
        track: browser
        type: action
        path: both
        title: ログインを実行する
        technical: form.requestSubmit()
        detail:
          description: 検証済みの認証情報を送信します。
          behavior: { given: ログイン操作が有効である, when: ログインを実行する, then: 自システムへ認証要求を送る }
          assumption: Enterキーによる送信も同じ処理へ合流します。
          links: [US-101, AC-101-SUBMIT]

      - id: login-request
        track: system
        type: command
        path: both
        title: ログイン要求を受け付ける
        technical: POST /api/session
        detail:
          description: 認証情報を受け取り、認証処理を開始します。
          behavior: { given: 形式検証済みの認証情報を受信している, when: 要求を受け付ける, then: 外部認証へ照会する }
          assumption: 過剰な試行はレート制限します。
          links: [CMD-AUTH-01]

      - id: account-query
        track: external
        type: integration
        path: both
        title: アカウントを照会する
        technical: POST /oauth/introspect
        detail:
          description: 外部認証システムへ資格情報を照会します。
          behavior: { given: 外部認証への接続が有効である, when: 資格情報を照会する, then: 有効性と会員識別子を返す }
          assumption: 外部認証がアカウントの有効性を保証します。
          links: [INT-IDP-02]

      - id: account-decision
        track: system
        type: decision
        path: both
        title: アカウントの有効性を判断する
        technical: AuthPolicy.evaluate()
        detail:
          description: 照会結果から成功と失敗へ分岐します。
          behavior: { given: 外部認証の結果を受け取っている, when: 有効性を評価する, then: 有効なら後続処理、無効なら拒否へ進む }
          assumption: 不明な応答は認証失敗として扱います。
          links: [RULE-AUTH-03]

      - id: profile-query
        track: external
        type: integration
        path: happy
        title: プロフィールを取得する
        technical: GET /members/{id}
        detail:
          description: トップ画面に必要な会員情報を取得します。
          behavior: { given: 有効な会員識別子がある, when: プロフィールを要求する, then: 表示名と権限を返す }
          assumption: 必要最小限の個人情報だけを取得します。
          links: [INT-MEMBER-01]

      - id: audit-login
        track: system
        type: event
        path: happy
        title: 認証成功を監査記録する
        technical: audit.auth.success
        detail:
          description: 認証成功の監査情報を記録します。
          behavior: { given: アカウントが有効である, when: 成功を確定する, then: 会員識別子と結果を監査記録する }
          assumption: 資格情報は監査ログへ記録しません。
          links: [AUDIT-01]

      - id: session-created
        track: resource
        type: state
        path: happy
        title: セッションを作成する
        technical: session_store.insert
        detail:
          description: プロフィールと権限をセッションとして保存します。
          behavior: { given: 会員プロフィールを取得している, when: セッションを作成する, then: IDと有効期限を保存する }
          assumption: セッションIDはSecure・HttpOnly Cookieで返します。
          links: [DATA-SESSION-01]

      - id: login-succeeded
        track: system
        join: all
        type: event
        path: happy
        title: ログイン成功を確定する
        technical: MemberAuthenticated
        detail:
          description: セッションと監査記録の完了後に成功を確定します。
          behavior: { given: 必要な後続処理が完了している, when: ログイン処理を完了する, then: トップ画面への遷移を返す }
          assumption: 成功イベントに資格情報を含めません。
          links: [EVT-AUTH-01]

      - id: login-rejected
        track: system
        type: event
        path: exception
        title: ログイン拒否を確定する
        technical: AuthenticationRejected
        detail:
          description: 安全なエラー理由へ変換して拒否を確定します。
          behavior: { given: アカウントが無効である, when: 認証ポリシーが拒否する, then: 再入力可能なエラーを作る }
          assumption: アカウントの存在有無を明かしません。
          links: [EVT-AUTH-04]

      - id: auth-error-response
        track: browser
        type: view
        path: exception
        title: 認証エラーを返す
        technical: "error: INVALID_CREDENTIALS"
        detail:
          description: ブラウザが表示可能な認証エラーを返します。
          behavior: { given: ログイン拒否が確定している, when: エラー応答を作る, then: 再入力可能な状態を返す }
          assumption: パスワード値は応答に含めません。
          links: [UI-LOGIN-02]

    edges:
      - { from: login-button-click, to: login-request, type: triggers, path: both }
      - { from: login-request, to: account-query, type: requests, path: both }
      - { from: account-query, to: account-decision, type: responds, path: both }
      - { from: account-decision, to: profile-query, type: requests, path: happy, label: VALID }
      - { from: account-decision, to: audit-login, type: produces, path: happy }
      - { from: profile-query, to: session-created, type: writes, path: happy }
      - { from: session-created, to: login-succeeded, type: produces, path: happy }
      - { from: audit-login, to: login-succeeded, type: enables, path: happy }
      - { from: account-decision, to: login-rejected, type: produces, path: exception, label: INVALID }
      - { from: login-rejected, to: auth-error-response, type: responds, path: exception }

  home-loading:
    kind: orchestration
    title: トップ画面用プロフィールを読み込む
    summary: ブラウザからの要求に対してセッションを参照し、外部APIを再呼び出さず表示情報を返します。
    entry: [profile-request]
    exits:
      happy: [profile-response]
      exception: []
    tracks:
      - { id: browser, label: ブラウザ, code: WEB }
      - { id: system, label: 自システム, code: APP }
      - { id: resource, label: セッション, code: DATA }
    groups: {}
    nodes:
      - id: profile-request
        track: browser
        type: command
        path: happy
        title: プロフィールを要求する
        technical: GET /api/me
        detail:
          description: トップ画面が現在の会員情報を要求します。
          behavior: { given: トップ画面が表示されている, when: 初期描画する, then: プロフィール要求を送る }
          assumption: 認証済みCookieを使用します。
          links: [QRY-MEMBER-01]

      - id: session-read
        track: resource
        type: state
        path: happy
        title: セッションを参照する
        technical: session_store.get
        detail:
          description: セッションから表示用プロフィールを読み取ります。
          behavior: { given: 認証済みセッションが存在する, when: セッションIDを参照する, then: 表示用プロフィールを返す }
          assumption: 外部プロフィールAPIは再度呼びません。
          links: [DATA-SESSION-01]

      - id: profile-response
        track: system
        type: event
        path: happy
        title: 表示用プロフィールを返す
        technical: CurrentMemberView
        detail:
          description: トップ画面で使う最小限のプロフィールを返します。
          behavior: { given: セッションを読み取っている, when: 応答を作る, then: 表示名と会員種別を返す }
          assumption: 権限のない項目を含めません。
          links: [US-103, QRY-MEMBER-01]

    edges:
      - { from: profile-request, to: session-read, type: reads, path: happy }
      - { from: session-read, to: profile-response, type: responds, path: happy }
