# yaml-language-server: $schema=../schema/sdd-flow.schema.json
schemaVersion: 3

scenario:
  id: password-reset
  project: 会員ポータル
  domain: アカウント管理
  title: パスワードを再設定する
  heading: 再設定を依頼して案内を確認するまで
  status: 下書き
  defaultStory: US-201
  defaultPath: happy
  selectedNode: reset-action

stories:
  - id: US-201
    title: パスワードを忘れたときに再設定したい
    state: 下書き
    nodes: [reset-screen, reset-action, guide-view]

experience:
  nodes:
    - id: reset-screen
      type: view
      path: both
      title: 再設定画面を見る
      technical: "route: /password/reset"
      detail:
        description: メールアドレスを入力できる再設定画面を表示します。
        behavior: { given: 未認証である, when: 再設定画面を開く, then: メールアドレス入力欄を確認できる }
        assumption: 認証なしで参照できます。
        links: [US-201, UI-RESET-01]

    - id: reset-action
      type: action
      path: both
      expands: reset-orchestration
      title: パスワード再設定を依頼する
      technical: Submit reset request
      detail:
        description: 登録メールアドレスを入力して再設定を依頼します。
        behavior: { given: 再設定画面が表示されている, when: メールアドレスを送信する, then: 存在有無を明かさず処理を受け付ける }
        assumption: 未登録アドレスでも同じ体験を返します。
        links: [US-201, AC-201-01]

    - id: guide-view
      type: view
      path: happy
      title: 案内メールの確認方法を見る
      technical: render ResetGuide
      detail:
        description: アカウントの存在有無にかかわらず同じ案内を表示します。
        behavior: { given: 再設定要求を処理している, when: 受付結果を受け取る, then: メール確認の案内を確認できる }
        assumption: 未登録アドレスでも同じ表示とします。
        links: [US-201, UI-RESET-02]

  edges:
    - { from: reset-screen, to: reset-action, type: sequence, path: both }
    - { from: reset-action, to: guide-view, type: transitions, path: happy }

subflows:
  reset-orchestration:
    kind: orchestration
    title: 再設定要求を安全に受け付ける
    summary: 使い捨てトークンを保存してメール配信を依頼し、アカウントの存在有無を外へ出さず受付を完了します。
    entry: [request-reset]
    exits:
      happy: [mail-accepted]
      exception: []
    tracks:
      - { id: browser, label: ブラウザ, code: WEB }
      - { id: system, label: 自システム, code: APP }
      - { id: external, label: メール配信, code: MAIL }
      - { id: resource, label: リソース, code: DATA }
    groups: {}
    nodes:
      - id: request-reset
        track: browser
        type: command
        path: both
        title: 再設定要求を送る
        technical: POST /api/password-reset
        detail:
          description: 入力されたメールアドレスで再設定処理を開始します。
          behavior: { given: メールアドレスが入力されている, when: 再設定を依頼する, then: 自システムへ要求を送る }
          assumption: 画面上では登録有無を確認しません。
          links: [US-201, CMD-RESET-01]

      - id: issue-token
        track: resource
        type: state
        path: happy
        title: 使い捨てトークンを保存する
        technical: reset_token.insert
        detail:
          description: 短時間だけ有効な再設定トークンを保存します。
          behavior: { given: 再設定要求を受け付けている, when: トークンを発行する, then: ハッシュと有効期限を保存する }
          assumption: 平文トークンは保存しません。
          links: [DATA-RESET-01]

      - id: send-mail
        track: external
        type: integration
        path: happy
        title: 案内メールを依頼する
        technical: Mail Delivery API
        detail:
          description: 再設定URLを含むメールの配信を依頼します。
          behavior: { given: 有効な使い捨てトークンがある, when: 配信APIへ要求する, then: 配信受付結果を返す }
          assumption: メール本文に個人情報を含めません。
          links: [INT-MAIL-01]

      - id: mail-accepted
        track: system
        type: event
        path: happy
        title: 再設定依頼の受付を確定する
        technical: ResetMailAccepted
        detail:
          description: 配信APIの受付後に再設定依頼の受付を確定します。
          behavior: { given: メール配信要求を受け付けている, when: 再設定処理を完了する, then: 画面へ受付結果を返す }
          assumption: 配信完了ではなく受付完了として記録します。
          links: [EVT-RESET-01]

    edges:
      - { from: request-reset, to: issue-token, type: writes, path: happy }
      - { from: issue-token, to: send-mail, type: requests, path: happy }
      - { from: send-mail, to: mail-accepted, type: responds, path: happy }
