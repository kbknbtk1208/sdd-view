# yaml-language-server: $schema=../schema/sdd-flow.schema.json
schemaVersion: 2

scenario:
  id: password-reset
  project: 会員ポータル
  domain: アカウント管理
  title: パスワードを再設定する
  heading: 再設定要求から案内メールが届くまで
  status: 下書き
  defaultStory: US-201
  defaultPath: happy
  defaultLevel: 2
  selectedNode: request-reset

lanes:
  - id: browser
    label: ユーザー / ブラウザ
    code: "01"
    subtitle: front stage
  - id: system
    label: 自システム
    code: "02"
    subtitle: application
  - id: external
    label: メール配信
    code: "03"
    subtitle: integration
  - id: resource
    label: リソース
    code: "04"
    subtitle: state

stories:
  - id: US-201
    title: 会員として再設定用の案内メールを受け取りたい
    state: 下書き
    nodes: [reset-screen, reset-action, request-reset, issue-token, send-mail, mail-sent, guide-view]

nodes:
  - id: reset-screen
    lane: browser
    column: 1
    type: view
    path: both
    title: { level1: 再設定を始める, level2: 再設定画面, level3: GET /password/reset }
    technical: "route: /password/reset"
    detail:
      description: 再設定対象のメールアドレスを入力する画面です。
      behavior: { given: 未認証である, when: 再設定画面を開く, then: メールアドレス入力欄を表示する }
      assumption: アカウントの存在有無は画面上で明らかにしません。
      links: [US-201, UI-RESET-01]
  - id: reset-action
    lane: browser
    column: 2
    type: action
    path: both
    title: { level1: メールを入力, level2: 再設定を依頼する, level3: submit reset form }
    technical: onSubmit(resetForm)
    detail:
      description: 会員がメールアドレスを入力して案内を依頼します。
      behavior: { given: メールアドレスを入力している, when: 案内を送るを選択する, then: 再設定要求を送る }
      assumption: 同一宛先への連続要求を制限します。
      links: [US-201, AC-201-01]
  - id: request-reset
    lane: system
    column: 3
    type: command
    path: both
    title: { level1: 再設定を受け付ける, level2: 再設定を要求する, level3: POST /api/password-reset }
    technical: RequestPasswordReset
    detail:
      description: 再設定要求を受け付け、使い捨てトークンの発行を開始します。
      behavior: { given: 形式が正しいメールアドレスを受信している, when: 再設定要求を受け付ける, then: 使い捨てトークンを発行する }
      assumption: 応答時間からアカウントの存在を推測できないようにします。
      links: [US-201, CMD-RESET-01]
  - id: issue-token
    lane: resource
    column: 4
    type: state
    path: happy
    title: { level1: 期限を設定, level2: トークンを保存する, level3: reset_token.insert }
    technical: "TTL: 15 min"
    detail:
      description: 一度だけ利用できる再設定トークンを保存します。
      behavior: { given: 対象アカウントが存在する, when: トークンを発行する, then: ハッシュ値と有効期限を保存する }
      assumption: 平文トークンは保存しません。
      links: [US-201, DATA-RESET-01]
  - id: send-mail
    lane: external
    column: 5
    type: integration
    path: happy
    title: { level1: 案内を送る, level2: 案内メールを送信する, level3: POST /messages }
    technical: Mail Delivery API
    detail:
      description: 再設定リンクを含む案内メールを配信します。
      behavior: { given: 有効な使い捨てトークンがある, when: 配信APIへ要求する, then: 配信受付結果を返す }
      assumption: メール本文にパスワードや個人情報を含めません。
      links: [US-201, INT-MAIL-01]
  - id: mail-sent
    lane: system
    column: 6
    type: event
    path: happy
    title: { level1: 受付完了, level2: 案内メールを受け付けた, level3: ResetMailAccepted }
    technical: "event: password-reset.accepted.v1"
    detail:
      description: メール配信要求を受け付けた事実を確定します。
      behavior: { given: 配信APIが要求を受け付けている, when: 再設定処理を完了する, then: 完了画面の表示情報を返す }
      assumption: 配信完了ではなく受付完了として記録します。
      links: [US-201, EVT-RESET-01]
  - id: guide-view
    lane: browser
    column: 7
    type: view
    path: happy
    title: { level1: メールを確認, level2: 案内を表示する, level3: render ResetGuide }
    technical: "view: password-reset/accepted"
    detail:
      description: アカウントの存在有無にかかわらず同じ案内を表示します。
      behavior: { given: 再設定要求の処理が完了している, when: 応答を受け取る, then: メール確認の案内を表示する }
      assumption: 未登録アドレスでも同じ表示とします。
      links: [US-201, UI-RESET-02]

edges:
  - { from: reset-screen, to: reset-action, type: sequence, path: both }
  - { from: reset-action, to: request-reset, type: triggers, path: both }
  - { from: request-reset, to: issue-token, type: writes, path: happy }
  - { from: issue-token, to: send-mail, type: requests, path: happy }
  - { from: send-mail, to: mail-sent, type: responds, path: happy }
  - { from: mail-sent, to: guide-view, type: transitions, path: happy }

subflows: {}
